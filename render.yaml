services:
  - type: web
    name: gumi-shelter-guide
    runtime: python
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120 app:app
    healthCheckPath: /api/config
    autoDeployTrigger: commit
    envVars:
      - key: TMAP_APP_KEY
        sync: false
